```html
<script type="module">

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  }
  from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  /* =====================================================
     YOUR FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "YOUR_API_KEY",

    authDomain:
      "YOUR_PROJECT.firebaseapp.com",

    projectId:
      "YOUR_PROJECT_ID",

    storageBucket:
      "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
      "YOUR_MESSAGING_SENDER_ID",

    appId:
      "YOUR_APP_ID"

  };


  /* =====================================================
     FIREBASE
  ===================================================== */

  const app =
    initializeApp(
      firebaseConfig
    );


  const auth =
    getAuth(app);


  /* =====================================================
     PAGE PROTECTION
  ===================================================== */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (!user) {

        window.location.replace(
          "admin-login.html"
        );

        return;

      }


      try {

        /*
          Force refresh so the latest
          custom admin claim is checked.
        */

        const tokenResult =
          await user.getIdTokenResult(
            true
          );


        if (
          tokenResult.claims.admin !== true
        ) {

          await signOut(auth);

          window.location.replace(
            "admin-login.html"
          );

          return;

        }


        /*
          Authorized administrator.
          Dashboard can now remain visible.
        */

        document.body.classList.add(
          "admin-authorized"
        );


        /*
          Optional: show admin email
          if an element exists.
        */

        const adminEmail =
          document.getElementById(
            "adminEmail"
          );


        if (adminEmail) {

          adminEmail.textContent =
            user.email || "Administrator";

        }


      } catch (error) {

        console.error(
          "Admin authorization error:",
          error
        );


        await signOut(auth);

        window.location.replace(
          "admin-login.html"
        );

      }

    }
  );


  /* =====================================================
     SECURE LOGOUT
  ===================================================== */

  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );


  if (logoutBtn) {

    logoutBtn.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();


        try {

          await signOut(auth);


          window.location.replace(
            "admin-login.html"
          );


        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

        }

      }
    );

  }

</script>
```
