<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our work | SNK Design Agency</title>
<meta name="description" content="Designs SNK Design Agency made for real businesses. Open a card to see the full design.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#08090d; --bg-soft:#0d0f14; --surface:#11141b; --surface-2:#161a22; --surface-3:#1b2029;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14);
  --text:#f5f7fa; --soft:#a9afbb; --muted:#747c89;
  --primary:#b8ff35; --primary-dark:#8bc91d;
  --t:.2s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,"Hind Siliguri","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{width:min(1180px,calc(100% - 40px));margin:0 auto}

/* header */
.site-head{position:sticky;top:0;z-index:50;background:rgba(8,9,13,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.site-head .wrap{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#10130b;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;letter-spacing:-.5px}
.brand strong{display:block;font-size:15px;line-height:1.2}
.brand span{display:block;color:var(--muted);font-size:11px}
.btn{min-height:40px;padding:0 16px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:var(--t);white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--surface-3);border-color:var(--border-2)}
.btn.primary{background:var(--primary);border-color:transparent;color:#10130b}
.btn.primary:hover{background:#caff76}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}

/* intro */
.intro{padding:56px 0 26px}
.intro h1{font-size:clamp(30px,5vw,46px);line-height:1.12;letter-spacing:-1.2px;max-width:16ch;font-weight:800}
.intro p{margin-top:14px;max-width:52ch;color:var(--soft)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search input{width:100%;height:44px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);outline:none;font-size:14px;transition:var(--t)}
.search input:focus{border-color:rgba(184,255,53,.55);box-shadow:0 0 0 3px rgba(184,255,53,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--soft);font-size:13px;font-weight:600;cursor:pointer;transition:var(--t)}
.chip:hover{border-color:var(--border-2);color:var(--text)}
.chip.on{background:var(--primary);border-color:transparent;color:#10130b}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;padding:14px 0 70px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:18px;background:var(--surface);overflow:hidden;transition:transform var(--t),border-color var(--t)}
.card:hover{transform:translateY(-3px);border-color:var(--border-2)}
.cover{height:170px;background-size:cover;background-position:center}
.logo{position:absolute;left:20px;top:132px;width:64px;height:64px;border-radius:16px;border:3px solid var(--surface);background:#fff center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:#10130b;font-weight:800;font-size:20px}
.body{padding:42px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}
.tag{padding:3px 10px;border-radius:999px;background:rgba(184,255,53,.1);color:var(--primary);font-weight:700}
.card h3{font-size:19px;line-height:1.3}
.card p{color:var(--soft);font-size:14px;flex:1}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.feature{grid-column:span 2}
.feature .cover{height:230px}
.feature .logo{top:192px}
.feature h3{font-size:24px}

.empty{grid-column:1/-1;padding:60px 24px;border:1px dashed var(--border-2);border-radius:18px;text-align:center;color:var(--soft)}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

footer{border-top:1px solid var(--border);padding:26px 0 40px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

@media (max-width:700px){
  .feature{grid-column:auto}
  .feature .cover{height:170px}.feature .logo{top:132px}.feature h3{font-size:19px}
  .site-head .btn.hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html">
      <div class="brand-mark">SNK</div>
      <div><strong>SNK Design Agency</strong><span>Our work</span></div>
    </a>
    <a class="btn hide-s" href="index.html#contact">Contact us</a>
    <a class="btn primary" href="client.html">Client login</a>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1>Designs we made for real businesses</h1>
    <p>Posters, brand kits and pages from our clients. Open a card to see the full design.</p>
    <div class="tools">
      <div class="search"><input type="search" id="q" placeholder="Search by company or topic" aria-label="Search designs"></div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="yr"></span> SNK Design Agency</span>
    <span>Designed and built by SNK</span>
  </div>
</footer>

<script type="module">
  import { FIREBASE_READY, db } from './firebase-init.js';
  import { collection, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
(function () {
  'use strict';
  var KEY = 'snk_links_v1';

  /* Data layer:
     FIREBASE_READY = false -> demo cards, or whatever links-admin.html
                                saved in THIS browser's storage.
     FIREBASE_READY = true  -> live Firestore data, same for every visitor.
     Fill in firebase-init.js with your config to switch over. */
  var DEMO = [
    { id: 'd1', name: 'Royal Multicare', category: 'Healthcare', description: 'Doctor schedule poster for a diagnostic and consultation centre.', url: '', color: '#0b5a9c', date: '2026-09-20' },
    { id: 'd2', name: 'Green Basket', category: 'Branding', description: 'Logo, colour system and packaging labels for a grocery start-up.', url: '', color: '#1f6b4f', date: '2026-09-14' },
    { id: 'd3', name: 'Nur Fashion House', category: 'Social media', description: 'A month of Facebook and Instagram post designs.', url: '', color: '#8a2b4d', date: '2026-09-06' },
    { id: 'd4', name: 'Sylhet Tea Co.', category: 'Website', description: 'One-page website with product gallery and order button.', url: '', color: '#9a4a10', date: '2026-08-28' }
  ];
  function loadLocal() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(d)) return d; } catch (e) {}
    return DEMO.slice();
  }
  function watchFirestore() {
    var col = collection(db, 'links');
    onSnapshot(query(col, orderBy('date', 'desc')), function (snap) {
      items = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      chips(); draw();
    }, function (err) {
      console.error(err);
      items = [];
      chips(); draw();
    });
  }

  function safeUrl(u) {
    try { var x = new URL(String(u || '').trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
  }
  function h(tag, cls, kids, attrs) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    (Array.isArray(kids) ? kids : kids == null ? [] : [kids]).forEach(function (k) { n.append(k); });
    return n;
  }
  function fmt(d) {
    var x = new Date(d); if (isNaN(x)) return '';
    return x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  var items = FIREBASE_READY ? [] : loadLocal().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
  var cat = 'All', term = '';

  function chips() {
    var cats = ['All'];
    items.forEach(function (i) { if (i.category && cats.indexOf(i.category) < 0) cats.push(i.category); });
    var box = document.getElementById('chips'); box.innerHTML = '';
    cats.forEach(function (c) {
      var b = h('button', 'chip' + (c === cat ? ' on' : ''), c, { type: 'button' });
      b.addEventListener('click', function () { cat = c; chips(); draw(); });
      box.append(b);
    });
  }

  function card(i, first) {
    var color = i.color || '#1d5b73';
    var cover = h('div', 'cover');
    cover.style.backgroundImage = i.cover
      ? 'url("' + i.cover + '")'
      : 'linear-gradient(135deg,' + color + ',#0d0f14)';
    var logo = h('div', 'logo', i.logo ? '' : (i.name || '?').trim().charAt(0).toUpperCase());
    if (i.logo) logo.style.backgroundImage = 'url("' + i.logo + '")';

    var url = safeUrl(i.url);
    var view = h('a', 'btn primary', url ? 'View design' : 'Link not added yet');
    if (url) { view.href = url; view.target = '_blank'; view.rel = 'noopener'; }
    else view.setAttribute('aria-disabled', 'true');

    var meta = h('div', 'meta', [h('span', 'tag', i.category || 'Design'), h('span', null, fmt(i.date))]);
    var body = h('div', 'body', [meta, h('h3', null, i.name), h('p', null, i.description || ''), h('div', 'actions', [view])]);
    return h('article', 'card' + (first ? ' feature' : ''), [cover, logo, body]);
  }

  function draw() {
    var grid = document.getElementById('grid'); grid.innerHTML = '';
    var t = term.trim().toLowerCase();
    var list = items.filter(function (i) {
      var okCat = cat === 'All' || i.category === cat;
      var okTerm = !t || (i.name + ' ' + (i.description || '') + ' ' + (i.category || '')).toLowerCase().indexOf(t) > -1;
      return okCat && okTerm;
    });
    if (!list.length) {
      grid.append(h('div', 'empty', [h('strong', null, items.length ? 'Nothing matches your search' : 'No designs yet'),
        items.length ? 'Try a different word or pick All.' : 'Designs will appear here once they are added.']));
      return;
    }
    list.forEach(function (i, idx) { grid.append(card(i, idx === 0 && cat === 'All' && !t && list.length > 2)); });
  }

  document.getElementById('q').addEventListener('input', function (e) { term = e.target.value; draw(); });
  document.getElementById('yr').textContent = new Date().getFullYear();
  if (FIREBASE_READY) watchFirestore(); else { chips(); draw(); }
})();
</script>
</body>
</html>
